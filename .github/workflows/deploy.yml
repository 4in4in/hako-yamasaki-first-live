name: Build and deploy PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: latest

      - name: Install fallback CJK fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: Compile PDF
        run: |
          mkdir -p build
          typst compile --root . --font-path fonts \
            --input "version=$(git describe --tags --always)" \
            src/main.typ build/hako-yamasaki-first-live.pdf

      - name: Assemble site
        run: |
          mkdir -p dist
          cp -r site/. dist/
          cp build/hako-yamasaki-first-live.pdf dist/
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: build/hako-yamasaki-first-live.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdf
          path: build
      - uses: softprops/action-gh-release@v2
        with:
          files: build/hako-yamasaki-first-live.pdf
          generate_release_notes: true
